# Dokploy: raiz do projeto = raiz do repositório.
# Configure NIXPACKS_CONFIG_FILE=deploy/nixpacks/web.toml.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npm run build --workspace=apps/web",
  "cp -a apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static",
  "cp -a apps/web/public apps/web/.next/standalone/apps/web/public",
]

[start]
cmd = "sh deploy/start-web.sh"
