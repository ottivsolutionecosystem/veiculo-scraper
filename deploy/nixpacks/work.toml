# Serviço de processamento: worker BullMQ + coletor Python.
# Dokploy: raiz do projeto = raiz do repositório.
# Configure NIXPACKS_CONFIG_FILE=deploy/nixpacks/work.toml.

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "python312", "python312Packages.pip"]

[phases.install]
cmds = [
  "npm ci",
  "python3 -m pip install --no-cache-dir -r services/collector/requirements.prod.txt",
]

[phases.build]
cmds = ["npm run build --workspace=apps/api"]

[start]
cmd = "bash deploy/start-work.sh"
